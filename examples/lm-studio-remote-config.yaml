# Простой пример конфигурации для тестирования удаленного LM Studio
# Примечание: Адаптер должен быть зарегистрирован программно перед запуском

workflow:
  name: "test-remote-lm-studio"
  version: "1.0"
  description: "Тестовый workflow для проверки подключения к удаленному LM Studio"
  author: "Workflow Orchestrator"
  
  settings:
    artifacts_dir: "artifacts/session_${timestamp}"
    default_adapter: "lm-studio-remote"
    parallel_execution: false
    max_retries: 2
    timeout: 120
    log_level: "info"
  
  # Определение ролей
  roles:
    assistant:
      adapter: "lm-studio-remote"
      role_definition: |
        Вы - полезный AI ассистент, работающий через удаленный LM Studio.
        Отвечайте кратко и по существу.
      temperature: 0.7
      max_tokens: 500
  
  # Шаги процесса
  steps:
    # Шаг 1: Простой тестовый запрос
    - id: "step1"
      name: "Тестовый запрос"
      type: "model"
      role: "assistant"
      description: "Простой запрос для проверки работы удаленного LM Studio"
      prompt: |
        Привет! Это тестовый запрос к удаленному LM Studio.
        
        Пожалуйста, ответь на следующие вопросы:
        1. Как тебя зовут?
        2. Какая у тебя модель?
        3. Можешь ли ты помочь с программированием?
        
        Ответь кратко, 2-3 предложения на каждый вопрос.
      outputs:
        test_response: "${artifacts_dir}/step1_test_response.md"
    
    # Шаг 2: Запрос с кодом
    - id: "step2"
      name: "Генерация кода"
      type: "model"
      role: "assistant"
      depends_on:
        - "step1"
      description: "Тест генерации кода"
      prompt: |
        Напиши простую функцию на JavaScript, которая:
        - Принимает массив чисел
        - Возвращает сумму всех четных чисел
        
        Добавь комментарии на русском языке.
      outputs:
        code_response: "${artifacts_dir}/step2_code_response.md"
    
    # Шаг 3: Анализ результатов
    - id: "step3"
      name: "Анализ результатов"
      type: "model"
      role: "assistant"
      depends_on:
        - "step2"
      description: "Анализ сгенерированного кода"
      prompt: |
        Проанализируй следующий код и предложи улучшения:
        
        ${artifact:${code_response}}
        
        Укажи:
        1. Что можно улучшить
        2. Есть ли потенциальные баги
        3. Как сделать код более эффективным
      outputs:
        analysis_response: "${artifacts_dir}/step3_analysis_response.md"
