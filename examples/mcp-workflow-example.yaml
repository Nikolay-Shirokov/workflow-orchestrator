# Пример конфигурации рабочего процесса с MCP-инструментами
workflow:
  name: "research-workflow"
  version: "1.0"
  description: "Рабочий процесс с использованием MCP-инструментов для веб-исследования"
  
  settings:
    artifacts_dir: "artifacts/session_${timestamp}"
    default_adapter: "claude-cli"
    parallel_execution: false
    max_retries: 3
    timeout: 300
    log_level: "info"
    
    # Конфигурация MCP-инструментов
    mcp_tools:
      # Инструмент веб-поиска
      - name: "web_search"
        checkCommand: "which mcp-web-search"  # Команда для проверки доступности
        expectedExitCode: 0
        timeout: 5000
        required: false  # Не обязателен, процесс продолжится без него
      
      # Инструмент доступа к файлам
      - name: "file_access"
        checkCommand: "which mcp-file-access"
        expectedExitCode: 0
        timeout: 5000
        required: false
      
      # Инструмент работы с базой данных
      - name: "database"
        checkCommand: "which mcp-database"
        expectedExitCode: 0
        timeout: 5000
        required: true  # Обязателен, процесс завершится с ошибкой если недоступен
  
  # Определение ролей
  roles:
    researcher:
      adapter: "claude-cli"
      model: "claude-sonnet-3.5"
      role_definition: |
        Вы - исследователь, который анализирует информацию и создает отчеты.
        Используйте доступные MCP-инструменты для сбора информации.
      # Разрешения: чтение и запись в artifacts
      default_permissions:
        read: ["*.md", "*.txt", "artifacts/**/*"]
        write: ["artifacts/**/*.md", "artifacts/**/*.txt"]
  
  # Шаги процесса
  steps:
    # Шаг 1: Инициализация
    - id: "init"
      name: "Инициализация исследования"
      type: "script"
      script: |
        echo "Начало исследования: ${research_topic}" > ${artifacts_dir}/init.txt
      outputs:
        init_file: "${artifacts_dir}/init.txt"
    
    # Шаг 2: Веб-исследование (условное выполнение)
    - id: "web_research"
      name: "Веб-исследование"
      type: "model"
      role: "researcher"
      # Условие: выполняется только если web_search доступен
      condition: "mcp_tools.web_search_available"
      prompt_template: |
        Проведите веб-исследование по теме: ${research_topic}
        
        Используйте инструмент веб-поиска для сбора актуальной информации.
        Создайте краткий отчет с основными находками.
      inputs:
        research_topic: "${research_topic}"
      outputs:
        web_research_file: "${artifacts_dir}/web_research.md"
    
    # Шаг 3: Анализ файлов (условное выполнение)
    - id: "file_analysis"
      name: "Анализ локальных файлов"
      type: "model"
      role: "researcher"
      # Условие: выполняется только если file_access доступен
      condition: "mcp_tools.file_access_available"
      prompt_template: |
        Проанализируйте локальные файлы, связанные с темой: ${research_topic}
        
        Используйте инструмент доступа к файлам для чтения релевантных документов.
        Создайте сводку найденной информации.
      inputs:
        research_topic: "${research_topic}"
      outputs:
        file_analysis_file: "${artifacts_dir}/file_analysis.md"
    
    # Шаг 4: Сводный отчет
    - id: "final_report"
      name: "Создание финального отчета"
      type: "model"
      role: "researcher"
      depends_on:
        - "web_research"
        - "file_analysis"
      prompt_template: |
        Создайте финальный отчет по теме: ${research_topic}
        
        Используйте следующую информацию:
        
        Веб-исследование:
        ${artifact:${web_research_file}}
        
        Анализ файлов:
        ${artifact:${file_analysis_file}}
        
        Создайте структурированный отчет с выводами и рекомендациями.
      inputs:
        research_topic: "${research_topic}"
        web_research_file: "${web_research_file}"
        file_analysis_file: "${file_analysis_file}"
      outputs:
        final_report_file: "${artifacts_dir}/final_report.md"
