# Пример конфигурации рабочего процесса с capabilities
# Демонстрирует использование web_search, web_fetch и mcp_tools
workflow:
  name: "research-workflow"
  version: "1.0"
  description: "Рабочий процесс с использованием capabilities для веб-исследования"

  settings:
    artifacts_dir: "artifacts/session_${timestamp}"
    default_adapter: "claude-cli"
    parallel_execution: false
    max_retries: 3
    timeout: 300
    log_level: "info"

  # Определение ролей с default_capabilities
  roles:
    researcher:
      adapter: "claude-cli"
      model: "claude-sonnet-3.5"
      role_definition: |
        Вы - исследователь, который анализирует информацию и создает отчеты.
        Используйте доступные инструменты для сбора информации.
      # Разрешения: чтение и запись в artifacts
      default_permissions:
        read: ["*.md", "*.txt", "artifacts/**/*"]
        write: ["artifacts/**/*.md", "artifacts/**/*.txt"]
      # Capabilities по умолчанию для роли
      default_capabilities:
        web_search: true   # Разрешить веб-поиск
        web_fetch: true    # Разрешить получение веб-страниц

    analyst:
      adapter: "gemini-cli"
      model: "gemini-pro"
      role_definition: |
        Вы - аналитик данных, который обрабатывает и структурирует информацию.
      default_permissions:
        read: ["artifacts/**/*", "data/**/*"]
        write: ["artifacts/**/*.md"]
      default_capabilities:
        web_search: true   # Gemini поддерживает google_web_search
        mcp_tools: ["analytics_tool", "chart_generator"]  # Конкретные MCP инструменты

    reviewer:
      adapter: "codex-cli"
      model: "o3"
      role_definition: |
        Вы - рецензент, который проверяет качество отчетов.
      default_permissions:
        read: ["artifacts/**/*"]
        write: ["artifacts/reviews/**/*.md"]
      default_capabilities:
        web_search: true   # Codex использует --search

  # Шаги процесса
  steps:
    # Шаг 1: Инициализация
    - id: "init"
      name: "Инициализация исследования"
      type: "script"
      script: |
        echo "Начало исследования: ${research_topic}" > ${artifacts_dir}/init.txt
      outputs:
        init_file: "${artifacts_dir}/init.txt"

    # Шаг 2: Веб-исследование с capabilities из роли
    - id: "web_research"
      name: "Веб-исследование"
      type: "model"
      role: "researcher"
      # Используются default_capabilities роли (web_search: true, web_fetch: true)
      prompt_template: |
        Проведите веб-исследование по теме: ${research_topic}

        Используйте веб-поиск для сбора актуальной информации.
        Создайте краткий отчет с основными находками.
      inputs:
        research_topic: "${research_topic}"
      outputs:
        web_research_file: "${artifacts_dir}/web_research.md"

    # Шаг 3: Анализ с ограниченными capabilities (переопределение роли)
    - id: "secure_analysis"
      name: "Безопасный анализ (без веб-доступа)"
      type: "model"
      role: "researcher"
      permissions:
        read: ["artifacts/**/*"]
        write: ["artifacts/analysis/**/*.md"]
        # Переопределяем capabilities роли - отключаем веб
        capabilities:
          web_search: false
          web_fetch: false
      prompt_template: |
        Проанализируйте результаты веб-исследования без дополнительного веб-доступа.

        Исследование:
        ${artifact:${web_research_file}}

        Создайте структурированный анализ.
      inputs:
        web_research_file: "${web_research_file}"
      outputs:
        analysis_file: "${artifacts_dir}/analysis/analysis.md"

    # Шаг 4: Анализ с использованием браузера (только Claude)
    - id: "browser_research"
      name: "Исследование через браузер"
      type: "model"
      role: "researcher"
      permissions:
        read: ["artifacts/**/*"]
        write: ["artifacts/**/*.md"]
        capabilities:
          browser: true     # Включить --chrome (только Claude)
          web_search: true
      prompt_template: |
        Используйте браузер для детального исследования темы: ${research_topic}

        Соберите дополнительную информацию с веб-страниц.
      inputs:
        research_topic: "${research_topic}"
      outputs:
        browser_research_file: "${artifacts_dir}/browser_research.md"

    # Шаг 5: Анализ данных с MCP (Gemini)
    - id: "data_analysis"
      name: "Анализ данных с MCP инструментами"
      type: "model"
      role: "analyst"
      # Используются default_capabilities роли: mcp_tools: ["analytics_tool", "chart_generator"]
      depends_on:
        - "web_research"
        - "secure_analysis"
      prompt_template: |
        Проанализируйте собранные данные используя аналитические инструменты.

        Веб-исследование:
        ${artifact:${web_research_file}}

        Анализ:
        ${artifact:${analysis_file}}

        Создайте визуализации и статистику.
      inputs:
        web_research_file: "${web_research_file}"
        analysis_file: "${analysis_file}"
      outputs:
        data_analysis_file: "${artifacts_dir}/data_analysis.md"

    # Шаг 6: Рецензирование с веб-поиском (Codex)
    - id: "review"
      name: "Рецензирование с проверкой фактов"
      type: "model"
      role: "reviewer"
      # Используются default_capabilities роли: web_search: true (--search в Codex)
      depends_on:
        - "data_analysis"
      prompt_template: |
        Проведите рецензию финального анализа.
        Используйте веб-поиск для проверки фактов.

        Анализ данных:
        ${artifact:${data_analysis_file}}

        Укажите на неточности и предложите улучшения.
      inputs:
        data_analysis_file: "${data_analysis_file}"
      outputs:
        review_file: "${artifacts_dir}/reviews/review.md"

    # Шаг 7: Финальный отчет
    - id: "final_report"
      name: "Создание финального отчета"
      type: "model"
      role: "researcher"
      depends_on:
        - "review"
      prompt_template: |
        Создайте финальный отчет по теме: ${research_topic}

        Учитывая:
        - Веб-исследование: ${artifact:${web_research_file}}
        - Анализ: ${artifact:${analysis_file}}
        - Анализ данных: ${artifact:${data_analysis_file}}
        - Рецензия: ${artifact:${review_file}}

        Создайте структурированный отчет с выводами и рекомендациями.
      inputs:
        research_topic: "${research_topic}"
        web_research_file: "${web_research_file}"
        analysis_file: "${analysis_file}"
        data_analysis_file: "${data_analysis_file}"
        review_file: "${review_file}"
      outputs:
        final_report_file: "${artifacts_dir}/final_report.md"
