# Тестовый workflow для итеративной обратной связи
# Один агент создаёт, другой проверяет (с фиксированным числом итераций)
workflow:
  name: "test-iterative-feedback"
  version: "1.0"
  description: "Итеративная проверка и улучшение через цикл"

  settings:
    artifacts_dir: "artifacts/feedback-test-${timestamp}"
    default_adapter: "claude-cli"
    log_level: "info"

  roles:
    writer:
      adapter: "claude-cli"
      model: "sonnet"
      role_definition: |
        Вы писатель, который создаёт и улучшает тексты.
      temperature: 0.7
      max_tokens: 2000

    reviewer:
      adapter: "gemini-cli"
      model: "gemini-2.5-pro"
      role_definition: |
        Вы строгий рецензент, который проверяет тексты на качество.
      temperature: 0.5
      max_tokens: 1000

  steps:
    # Шаг 1: Пользователь задаёт задание
    - id: "step1_task"
      name: "Задание для текста"
      type: "user_input"
      input_mode: "file"
      file_format: "markdown"
      prompt_message: |
        # Задание для создания текста

        Опишите, какой текст нужно создать (тему, стиль, объём).
      outputs:
        task: "${artifacts_dir}/step1_task.md"

    # Шаг 2: Цикл улучшения (3 итерации)
    - id: "step2_improvement_loop"
      name: "Цикл улучшения"
      type: "loop"
      depends_on: ["step1_task"]
      loop_iterations: 3
      loop_variable: "iteration"
      loop_body:
        # Внутри итерации - последовательное выполнение
        # Сначала писатель, потом рецензент
        id: "write_text"
        name: "Написание текста"
        type: "model"
        role: "writer"
        prompt_template: |
          Итерация ${loop_iteration} из 3.

          ${if(loop_index == 0, "Создай текст согласно заданию:", "Улучши текст с учётом замечаний:")}

          ## Задание
          ${task}

          ${if(loop_index > 0, "## Предыдущая версия\n\n" + prev_text + "\n", "")}
          ${if(loop_index > 0, "## Замечания рецензента\n\n" + prev_feedback + "\n", "")}

          ${if(loop_index == 0, "Напиши первую версию текста.", "Исправь текст с учётом всех замечаний.")}
        inputs:
          task: "${task}"
          prev_text: "${current_text}"
          prev_feedback: "${current_feedback}"
        outputs:
          current_text: "${artifacts_dir}/iteration_${loop_iteration}_text.md"

    # Шаг 3: Финальная версия
    - id: "step3_final"
      name: "Финальная версия"
      type: "model"
      role: "writer"
      depends_on: ["step2_improvement_loop"]
      prompt_template: |
        Подготовь финальную версию текста после всех итераций улучшения:

        ## Последняя версия
        ${current_text}

        ## Последний отзыв
        ${current_feedback}

        Если нужны минимальные правки - внеси их. Иначе оставь как есть.
      inputs:
        current_text: "${current_text}"
        current_feedback: "${current_feedback}"
      outputs:
        final_text: "${artifacts_dir}/step3_final.md"
