# Тестовый workflow для итеративной обратной связи
# Писатель создаёт текст, улучшая его на каждой итерации
workflow:
  name: "test-iterative-feedback"
  version: "1.0"
  description: "Итеративное улучшение текста через цикл"

  settings:
    artifacts_dir: "artifacts/feedback-test-${timestamp}"
    default_adapter: "claude-cli"
    log_level: "warn"

  roles:
    writer:
      adapter: "claude-cli"
      model: "haiku"
      role_definition: |
        Вы писатель, который создаёт и улучшает тексты.
        На каждой итерации анализируйте предыдущую версию и улучшайте её.
      temperature: 0.7
      max_tokens: 2000
      default_permissions:
        read: ["*.md", "*.txt", "artifacts/**/*"]
        write: ["artifacts/**/*"]

  steps:
    # Шаг 1: Пользователь задаёт тему
    - id: "step1_task"
      name: "Задание темы"
      type: "user_input"
      input_mode: "file"
      file_format: "markdown"
      prompt_message: |
        # Тема для текста

        Опишите тему и требования к тексту (стиль, объём, ключевые моменты).
      outputs:
        task: "${artifacts_dir}/step1_task.md"

    # Шаг 1.5: Инициализация current_text (пустое значение для первой итерации)
    - id: "step1_5_init"
      name: "Инициализация"
      type: "script"
      depends_on: ["step1_task"]
      script: echo "(Первая итерация - предыдущей версии нет)"
      shell: "bash"
      outputs:
        current_text: "${artifacts_dir}/init.txt"

    # Шаг 2: Цикл улучшения (3 итерации)
    - id: "step2_improvement_loop"
      name: "Цикл улучшения"
      type: "loop"
      depends_on: ["step1_5_init"]
      loop_iterations: 3
      loop_variable: "iteration"
      loop_body:
        id: "write_text"
        name: "Написание/улучшение текста"
        type: "model"
        role: "writer"
        prompt_template: |
          Итерация ${loop_iteration} из 3.

          ## Задание
          ${task}

          ## Инструкция
          Это итерация номер ${loop_iteration}.

          - Если это первая итерация: создай первоначальную версию текста.
          - Если это не первая итерация: прочитай предыдущую версию и улучши её,
            исправив недостатки и добавив деталей.

          ## Предыдущая версия (если есть)
          ${current_text}

          ---
          Напиши текст и кратко опиши, что было улучшено на этой итерации.
        inputs:
          task: "${task}"
          current_text: "${current_text}"
        outputs:
          current_text: "${artifacts_dir}/iteration_${loop_iteration}_text.md"

    # Шаг 3: Финальная версия
    - id: "step3_final"
      name: "Финальная версия"
      type: "model"
      role: "writer"
      depends_on: ["step2_improvement_loop"]
      prompt_template: |
        Процесс итеративного улучшения завершён.

        ## Последняя версия текста
        ${current_text}

        Проверь текст на финальные мелкие правки (орфография, пунктуация).
        Если нужны - внеси их. Иначе оставь как есть.
      inputs:
        current_text: "${current_text}"
      outputs:
        final_text: "${artifacts_dir}/step3_final.md"
