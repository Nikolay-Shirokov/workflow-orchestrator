# Workflow для проектирования бизнес-требований
# Совместная работа двух AI-моделей для создания детальных требований

workflow:
  name: "business-requirements-design"
  version: "2.0"
  description: "Создание бизнес-требований через совместную работу двух AI-моделей с файловым вводом"
  author: "Workflow Orchestrator Team"
  
  settings:
    artifacts_dir: "artifacts/requirements-${timestamp}"
    default_adapter: "claude-cli"
    default_input_mode: "file"  # Использовать файловый ввод
    default_file_format: "markdown"
    log_level: "info"
    
    # Конфигурация редактора
    default_editor:
      command: "code"
      args: ["--wait"]
      wait: true
  
  # Определение ролей
  roles:
    architect:
      adapter: "claude-cli"
      model: "claude-sonnet-3.5"
      role_definition: |
        Вы - ГЛАВНЫЙ АРХИТЕКТОР в процессе разработки требований.
        Ваша роль - задавать глубокие вопросы, анализировать потребности
        и формировать структурированные требования.
        Вы фокусируетесь на полноте, ясности и реализуемости требований.
      temperature: 0.7
      max_tokens: 4000
      # Разрешения по умолчанию для архитектора
      default_permissions:
        read: ["*.md", "artifacts/**/*"]
        write: ["artifacts/**/*.md"]

    copilot:
      adapter: "claude-cli"
      model: "claude-sonnet-3.5"
      role_definition: |
        Вы - ВТОРОЙ ПИЛОТ, предоставляющий критический анализ и альтернативные перспективы.
        Ваша роль - выявлять пробелы, предлагать улучшения и задавать вопросы,
        которые могли быть упущены.
        Вы фокусируетесь на пользовательском опыте и практичности решения.
      temperature: 0.7
      max_tokens: 4000
      # Разрешения по умолчанию для второго пилота
      default_permissions:
        read: ["*.md", "artifacts/**/*"]
        write: ["artifacts/**/*.md"]
  
  steps:
    # ============================================================
    # ШАГ 1: Сбор описания потребности от пользователя
    # ============================================================
    - id: "step1_user_need"
      name: "Описание потребности"
      type: "user_input"
      description: "Сбор описания потребности пользователя через файловый ввод"
      input_mode: "file"
      file_format: "markdown"
      prompt_message: |
        # Описание вашей потребности
        
        Опишите подробно, что вы хотите создать или какую проблему решить.
        Чем больше деталей вы предоставите, тем лучше мы сможем помочь.
        
        ## Что вы хотите создать/решить?
        
        [Опишите вашу идею или проблему]
        
        ## Для кого это предназначено?
        
        [Опишите целевую аудиторию]
        
        ## Какие у вас есть ограничения или предпочтения?
        
        [Бюджет, сроки, технологии и т.д.]
        
        ## Дополнительная информация
        
        [Любая другая важная информация]
      outputs:
        user_need: "${artifacts_dir}/step1_user_need.md"
    
    # ============================================================
    # ШАГ 2: Архитектор формирует первичные вопросы
    # ============================================================
    - id: "step2_architect_questions"
      name: "Вопросы от архитектора"
      type: "model"
      role: "architect"
      depends_on: ["step1_user_need"]
      description: "Архитектор формирует вопросы для уточнения требований"
      prompt_template: |
        Пользователь описал свою потребность:
        
        ${user_need}
        
        Задай все необходимые вопросы для решения этой задачи.
        Сфокусируйся на:
        - Функциональных требованиях
        - Технических аспектах
        - Ограничениях и зависимостях
        - Критериях успеха
        
        Сформулируй вопросы четко и структурированно.
      inputs:
        user_need: "${user_need}"
      outputs:
        architect_questions: "${artifacts_dir}/step2_architect_questions.md"
    
    # ============================================================
    # ШАГ 3: Второй пилот формирует свои вопросы
    # ============================================================
    - id: "step3_copilot_questions"
      name: "Вопросы от второго пилота"
      type: "model"
      role: "copilot"
      depends_on: ["step1_user_need"]
      description: "Второй пилот формирует альтернативные вопросы"
      prompt_template: |
        Пользователь описал свою потребность:
        
        ${user_need}
        
        Задай все необходимые вопросы для решения этой задачи.
        Сфокусируйся на:
        - Пользовательском опыте
        - Бизнес-логике
        - Рисках и проблемах
        - Альтернативных подходах
        
        Сформулируй вопросы четко и структурированно.
      inputs:
        user_need: "${user_need}"
      outputs:
        copilot_questions: "${artifacts_dir}/step3_copilot_questions.md"
    
    # ============================================================
    # ШАГ 4: Архитектор анализирует вопросы второго пилота
    # ============================================================
    - id: "step4_architect_analysis"
      name: "Анализ архитектора"
      type: "model"
      role: "architect"
      depends_on: ["step1_user_need", "step2_architect_questions", "step3_copilot_questions"]
      description: "Архитектор анализирует вопросы второго пилота"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Я задал этот же вопрос другой нейросети. Ты будешь главным архитектором,
        а она "вторым пилотом".
        
        Вот вопросы от второго пилота:
        
        <copilot>
        ${copilot_questions}
        </copilot>
        
        Вот твои вопросы:
        
        <architect>
        ${architect_questions}
        </architect>
        
        Проанализируй их в контексте исходной потребности, собери вместе то, 
        с чем вы согласны, и выдели то, что есть только у них или у тебя. 
        Укажи, какие вопросы наиболее важны для решения задачи пользователя.
      inputs:
        user_need: "${user_need}"
        copilot_questions: "${copilot_questions}"
        architect_questions: "${architect_questions}"
      outputs:
        architect_analysis: "${artifacts_dir}/step4_architect_analysis.md"
    
    # ============================================================
    # ШАГ 5: Второй пилот дает рекомендации
    # ============================================================
    - id: "step5_copilot_analysis"
      name: "Рекомендации второго пилота"
      type: "model"
      role: "copilot"
      depends_on: ["step1_user_need", "step2_architect_questions", "step3_copilot_questions"]
      description: "Второй пилот анализирует вопросы архитектора"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Отлично, ты будешь работать со мной и другой нейросетью как "второй пилот".
        Она дает основу, а ты анализируешь и даешь рекомендации.
        
        Сейчас я дам тебе резюме вопросов от архитектора:
        
        <architect>
        ${architect_questions}
        </architect>
        
        Вот твои вопросы для сравнения:
        
        <copilot>
        ${copilot_questions}
        </copilot>
        
        Проанализируй их в контексте исходной потребности и дай рекомендации:
        - Что упущено для решения задачи пользователя?
        - Что можно улучшить?
        - Какие вопросы избыточны?
        - Какие аспекты требуют большего внимания?
      inputs:
        user_need: "${user_need}"
        architect_questions: "${architect_questions}"
        copilot_questions: "${copilot_questions}"
      outputs:
        copilot_analysis: "${artifacts_dir}/step5_copilot_analysis.md"
    
    # ============================================================
    # ШАГ 6: Архитектор формирует MVP вопросы
    # ============================================================
    - id: "step6_architect_mvp_questions"
      name: "MVP вопросы от архитектора"
      type: "model"
      role: "architect"
      depends_on: ["step1_user_need", "step4_architect_analysis", "step5_copilot_analysis"]
      description: "Архитектор формирует финальные вопросы для MVP"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Вот мнение по вопросам от второго пилота:
        
        <copilot_analysis>
        ${copilot_analysis}
        </copilot_analysis>
        
        Вот твой анализ:
        
        <architect_analysis>
        ${architect_analysis}
        </architect_analysis>
        
        Напиши мне такой список вопросов, ответив на который, мы получим
        самый простой минимальный рабочий вариант (MVP) для решения 
        потребности пользователя.
        
        Сфокусируйся на:
        - Критически важных функциях для решения задачи
        - Минимальных требованиях для запуска
        - Ключевых решениях, которые нужно принять сейчас
        
        Сформулируй вопросы четко, пронумеруй их.
      inputs:
        user_need: "${user_need}"
        copilot_analysis: "${copilot_analysis}"
        architect_analysis: "${architect_analysis}"
      outputs:
        architect_mvp_questions: "${artifacts_dir}/step6_architect_mvp_questions.md"
    
    # ============================================================
    # ШАГ 7: Второй пилот предлагает улучшения
    # ============================================================
    - id: "step7_copilot_improvements"
      name: "Улучшения от второго пилота"
      type: "model"
      role: "copilot"
      depends_on: ["step1_user_need", "step6_architect_mvp_questions"]
      description: "Второй пилот предлагает улучшения для MVP вопросов"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Я хочу MVP для решения этой потребности. Посмотри что предложил архитектор:
        
        <architect_mvp>
        ${architect_mvp_questions}
        </architect_mvp>
        
        Напиши только предложения к упрощению/улучшению вопросов в контексте
        создания MVP для решения потребности пользователя.
        
        Сфокусируйся на:
        - Упрощении формулировок
        - Удалении избыточных вопросов
        - Объединении связанных вопросов
        - Приоритизации вопросов
        
        Будь конкретен и конструктивен.
      inputs:
        user_need: "${user_need}"
        architect_mvp_questions: "${architect_mvp_questions}"
      outputs:
        copilot_improvements: "${artifacts_dir}/step7_copilot_improvements.md"
    
    # ============================================================
    # ШАГ 8: Архитектор формирует финальные вопросы
    # ============================================================
    - id: "step8_final_questions"
      name: "Финальные вопросы"
      type: "model"
      role: "architect"
      depends_on: ["step1_user_need", "step6_architect_mvp_questions", "step7_copilot_improvements"]
      description: "Архитектор формирует финальный список вопросов"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Держи мнение второго пилота по вопросам для пользователя:
        
        <copilot_improvements>
        ${copilot_improvements}
        </copilot_improvements>
        
        Твои MVP вопросы:
        
        <mvp_questions>
        ${architect_mvp_questions}
        </mvp_questions>
        
        Напиши итоговый список вопросов для пользователя, которые помогут
        создать требования для решения его потребности.
        
        Требования к списку:
        - Четкие, понятные формулировки
        - Логическая группировка по темам
        - Нумерация вопросов
        - Краткие пояснения где необходимо
        - Примеры ответов для сложных вопросов
        
        Формат:
        ## [Название группы]
        
        ### Вопрос N: [Текст вопроса]
        [Краткое пояснение]
        [Пример ответа при необходимости]
      inputs:
        user_need: "${user_need}"
        copilot_improvements: "${copilot_improvements}"
        architect_mvp_questions: "${architect_mvp_questions}"
      outputs:
        final_questions: "${artifacts_dir}/step8_final_questions.md"
    
    # ============================================================
    # ШАГ 9: Пользователь отвечает на вопросы (файловый ввод)
    # ============================================================
    - id: "step9_user_answers"
      name: "Ответы пользователя"
      type: "user_input"
      description: "Пользователь отвечает на финальные вопросы через файловый ввод"
      depends_on: ["step8_final_questions"]
      input_mode: "file"
      file_format: "markdown"
      include_questions: false  # Не включать вопросы в контекст (оптимизация)
      editor:
        command: "code"
        args: ["--wait", "--new-window"]
        wait: true
      prompt_template: |
        # Ответы на вопросы по требованиям
        
        Ниже представлены вопросы для формирования требований к вашему проекту.
        Пожалуйста, ответьте на них максимально подробно.
        
        ${final_questions}
        
        ---
        
        ## ИНСТРУКЦИЯ ПО ЗАПОЛНЕНИЮ
        
        1. Отвечайте под каждым вопросом
        2. Используйте конкретные примеры где возможно
        3. Если вопрос не применим, напишите "Не применимо" и объясните почему
        4. Можете добавлять дополнительную информацию
        5. Сохраните файл (Ctrl+S / Cmd+S) перед выбором "Продолжить"
        
        ---
        
        # ВАШИ ОТВЕТЫ
        
        [Начните отвечать здесь]
      inputs:
        final_questions: "${final_questions}"
      outputs:
        user_answers: "${artifacts_dir}/step9_user_answers.md"
    
    # ============================================================
    # ШАГ 10: Архитектор формирует финальные требования
    # ============================================================
    - id: "step10_final_requirements"
      name: "Финальные требования"
      type: "model"
      role: "architect"
      depends_on: ["step9_user_answers", "step1_user_need"]
      description: "Архитектор формирует полные бизнес-требования"
      # Явные разрешения для этого шага:
      # - Чтение предыдущих артефактов
      # - Запись финального документа
      permissions:
        read: ["${artifacts_dir}/*.md"]
        write: ["${artifacts_dir}/step10_*.md"]
      prompt_template: |
        На основе ответов пользователя сформируй полностью описанные
        бизнес-требования.
        
        ## Исходная потребность
        
        ${user_need}
        
        ## Ответы пользователя
        
        ${user_answers}
        
        ## Задача
        
        Создай документ с бизнес-требованиями, включающий:
        
        1. **Краткое описание проекта**
           - Цель проекта
           - Целевая аудитория
           - Ключевая ценность
        
        2. **Функциональные требования**
           - Основные функции (must-have)
           - Дополнительные функции (nice-to-have)
           - Детальное описание каждой функции
        
        3. **Нефункциональные требования**
           - Производительность
           - Безопасность
           - Масштабируемость
           - Доступность
        
        4. **Сценарии использования**
           - Основные user stories
           - Пошаговые сценарии
           - Альтернативные потоки
        
        5. **Сценарии тестирования**
           - Критерии приемки
           - Тестовые случаи
           - Граничные условия
        
        6. **Диаграммы взаимодействия (Mermaid)**
           - Диаграмма последовательности для ключевых сценариев
           - Диаграмма компонентов (если применимо)
        
        7. **Ограничения и зависимости**
           - Технические ограничения
           - Бюджетные ограничения
           - Временные рамки
           - Внешние зависимости
        
        8. **Критерии успеха**
           - Метрики успеха
           - KPI
        
        Требования к документу:
        - Без "воды", только конкретика
        - Структурированный формат
        - Четкие формулировки
        - Измеримые критерии где возможно
        - Приоритизация требований (must-have, should-have, nice-to-have)
      inputs:
        user_need: "${user_need}"
        user_answers: "${user_answers}"
      outputs:
        final_requirements: "${artifacts_dir}/step10_final_requirements.md"
    
    # ============================================================
    # ШАГ 11: Второй пилот проводит ревью требований
    # ============================================================
    - id: "step11_requirements_review"
      name: "Ревью требований"
      type: "model"
      role: "copilot"
      depends_on: ["step1_user_need", "step9_user_answers", "step10_final_requirements"]
      description: "Второй пилот проводит критическое ревью требований"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Вот ответы пользователя на вопросы:
        
        <user_answers>
        ${user_answers}
        </user_answers>
        
        Проведи критическое ревью следующих бизнес-требований:
        
        <requirements>
        ${final_requirements}
        </requirements>
        
        Проанализируй в контексте исходной потребности и ответов:
        
        1. **Полнота**
           - Все ли аспекты исходной потребности покрыты?
           - Все ли ответы пользователя учтены?
           - Что упущено?
        
        2. **Ясность**
           - Все ли требования понятны?
           - Есть ли двусмысленности?
        
        3. **Реализуемость**
           - Реалистичны ли требования?
           - Есть ли противоречия?
        
        4. **Приоритизация**
           - Правильно ли расставлены приоритеты?
           - Что действительно критично для MVP?
        
        5. **Риски**
           - Какие риски не учтены?
           - Что может пойти не так?
        
        Предоставь:
        - Список найденных проблем
        - Конкретные рекомендации по улучшению
        - Предложения по оптимизации
        
        Будь конструктивен и конкретен.
      inputs:
        user_need: "${user_need}"
        user_answers: "${user_answers}"
        final_requirements: "${final_requirements}"
      outputs:
        requirements_review: "${artifacts_dir}/step11_requirements_review.md"
    
    # ============================================================
    # ШАГ 12: Архитектор создает финальную версию с учетом ревью
    # ============================================================
    - id: "step12_final_version"
      name: "Финальная версия требований"
      type: "model"
      role: "architect"
      depends_on: ["step1_user_need", "step9_user_answers", "step10_final_requirements", "step11_requirements_review"]
      description: "Архитектор создает финальную версию с учетом ревью"
      prompt_template: |
        Напоминаю исходную потребность пользователя:
        
        <user_need>
        ${user_need}
        </user_need>
        
        Вот ответы пользователя:
        
        <user_answers>
        ${user_answers}
        </user_answers>
        
        Вот бизнес-требования, которые ты создал:
        
        <requirements>
        ${final_requirements}
        </requirements>
        
        Вот ревью от второго пилота:
        
        <review>
        ${requirements_review}
        </review>
        
        Создай финальную версию требований, учитывая все замечания и рекомендации.
        Убедись, что требования полностью соответствуют исходной потребности и 
        учитывают все ответы пользователя.
        
        Сохрани структуру, но:
        - Исправь найденные проблемы
        - Добавь упущенные аспекты из исходной потребности и ответов
        - Уточни неясные моменты
        - Оптимизируй приоритизацию
        - Добавь раздел с рисками и их митигацией
        
        Это должна быть финальная, готовая к использованию версия документа,
        которая полностью решает потребность пользователя.
      inputs:
        user_need: "${user_need}"
        user_answers: "${user_answers}"
        final_requirements: "${final_requirements}"
        requirements_review: "${requirements_review}"
      outputs:
        final_version: "${artifacts_dir}/step12_final_requirements_v2.md"
