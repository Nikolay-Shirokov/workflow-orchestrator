# Тестовый сценарий для Claude CLI адаптера
# Проверяет базовые функции: stdin, модель, вывод

workflow:
  name: "test-claude-cli"
  version: "1.0"
  description: "Тест Claude CLI адаптера"

  settings:
    artifacts_dir: "artifacts/test-claude-${timestamp}"
    default_adapter: "claude-cli"
    log_level: "debug"

  roles:
    tester:
      adapter: "claude-cli"
      model: "sonnet"
      role_definition: "Ты тестовый ассистент. Отвечай кратко."
      temperature: 0.3
      max_tokens: 500
      permissions:
        - read
        - "edit:artifacts/**/*"
      default_permissions:
        read: ["**/*"]
        write: ["artifacts/**/*"]

  steps:
    # Тест 1: Базовый запрос через stdin
    - id: test1_basic
      name: "Тест 1: Базовый запрос"
      type: model
      role: tester
      prompt_template: |
        Скажи "Hello from Claude CLI" и больше ничего.
      outputs:
        result: "${artifacts_dir}/test1_basic.md"

    # Тест 2: Запрос на русском (проверка кодировки)
    - id: test2_russian
      name: "Тест 2: Русский текст"
      type: model
      role: tester
      prompt_template: |
        Скажи "Привет от Claude CLI" на русском языке и больше ничего.
      outputs:
        result: "${artifacts_dir}/test2_russian.md"

    # Тест 3: Генерация структурированного вывода
    - id: test3_structured
      name: "Тест 3: Структурированный вывод"
      type: model
      role: tester
      prompt_template: |
        Создай JSON объект с полями:
        - adapter: "claude-cli"
        - status: "working"
        - timestamp: текущая дата

        Выведи ТОЛЬКО JSON, без пояснений.
      outputs:
        result: "${artifacts_dir}/test3_structured.json"
