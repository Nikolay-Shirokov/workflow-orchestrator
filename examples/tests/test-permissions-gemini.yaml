# Тест permissions для Gemini CLI
# Проверяет write permissions

workflow:
  name: "test-permissions-gemini"
  version: "1.0"
  description: "Тест permissions Gemini CLI"

  settings:
    artifacts_dir: "artifacts/test-perm-gemini-${timestamp}"
    log_level: "debug"

  roles:
    writer:
      adapter: "gemini-cli"
      model: "gemini-2.5-pro"
      role_definition: "Ты помощник. Записывай результат в указанный файл."
      temperature: 0.1
      max_tokens: 500
      permissions:
        - read
        - "edit:artifacts/**/*"
      default_permissions:
        read: ["**/*"]
        write: ["artifacts/**/*"]

  steps:
    # Тест: Write permission
    - id: test_write
      name: "Тест: write_file tool"
      type: model
      role: writer
      prompt_template: |
        Напиши текст: "File written by Gemini using write_file tool"

        Сохрани этот текст в файл используя инструмент write_file.
      outputs:
        result: "${artifacts_dir}/written_result.txt"
